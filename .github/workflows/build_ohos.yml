name: Build HarmonyOS (ohos)

on:
  workflow_dispatch:
  push:
    branches:
      - ohos-support
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  FLUTTER_VERSION: oh-3.41.9-release

jobs:
  build_ohos:
    name: Build ohos HAP (unsigned)
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa python3
        shell: bash

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup flutter-ohos
        run: |
          git clone -b $FLUTTER_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      # pub 拉取 git 依赖时跳过 LFS smudge（permission_handler 仓库 example 下
      # 有服务端缺失的 LFS 文件会直接失败），随后再按仓库补拉真实文件；
      # gitcode 网络偶发中断，重试三次，全部失败时显式报错退出
      - name: Get Flutter dependencies
        run: |
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && exit 0
            echo "pub get failed, retry ($i/3)..."; sleep 20
          done
          echo "ERROR: flutter pub get failed after 3 attempts" >&2
          exit 1
        working-directory: simple_live_app
        shell: bash

      # 补拉 media_kit 适配仓库的 LFS 大文件（libmpv.so.2），否则打进 HAP 的
      # 是 133 字节指针文件，安装后白屏
      - name: Restore git LFS objects (libmpv)
        run: |
          set -e
          found=0
          for d in "$HOME"/.pub-cache/git/fluttertpc_flutter_media_kit-*; do
            [ -d "$d" ] || continue
            found=1
            echo "git lfs pull: $d"
            (cd "$d" && git lfs pull)
          done
          if [ "$found" = 0 ]; then
            echo "ERROR: no fluttertpc_flutter_media_kit checkout in pub-cache (pub get failed?)" >&2
            exit 1
          fi
        shell: bash

      # flutter_tools 三补丁（详见 README_OHOS.md）：
      # 1. ohos 构建把 NativeAssetsManifest.json 打进 flutter_assets
      #    （缺它运行时报 "No asset with id ... found"，如 dart_quickjs）
      # 2. Windows 下 flutter_tools 直接 spawn 裸 'ohpm' 必败（无 ohpm.exe），
      #    改为优先调用项目内垫片 ohos/build-tools/ohpm/bin/ohpm.bat
      # 3. pub get 后的平台工具再生成不再强制鸿蒙 SDK
      - name: Patch flutter_tools (ohos)
        run: python3 tool/patch_flutter_tools_ohos.py "$GITHUB_WORKSPACE/flutter"
        working-directory: simple_live_app
        shell: bash

      - name: Build HAP (release, unsigned)
        run: flutter build hap --release --no-codesign
        working-directory: simple_live_app
        shell: bash

      # 防止 LFS 指针占位文件混入产物（会导致安装后白屏）
      - name: Verify HAP libraries
        run: |
          python3 tool/verify_ohos_hap.py ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap
        working-directory: simple_live_app
        shell: bash

      - name: Package output
        run: |
          cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
             simple_live_ohos_release_unsigned.hap
        working-directory: simple_live_app
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_ohos
          path: simple_live_app/simple_live_ohos_release_unsigned.hap
