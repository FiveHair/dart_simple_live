name: Build HarmonyOS (ohos)

on:
  workflow_dispatch:
  push:
    branches:
      - ohos-support
    paths-ignore:
      - '**.md'
      - '.gitignore'

env:
  FLUTTER_VERSION: oh-3.41.9-release

jobs:
  build_ohos:
    name: Build ohos HAP (unsigned)
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa python3
        shell: bash

      # permission_handler 仓库的 example 目录下有一个服务端缺失的 LFS 文件，
      # 跳过 example 目录；其余 LFS 大文件（libmpv 等）必须正常下载，
      # 否则 HAP 内是 133 字节的 LFS 指针，安装后白屏
      - name: Configure git LFS excludes
        run: git config --global lfs.fetchexclude "example/**"
        shell: bash

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup flutter-ohos
        run: |
          git clone -b $FLUTTER_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: simple_live_app
        shell: bash

      # ohos debug 构建缺少 NativeAssetsManifest.json 的工具链补丁（详见 README_OHOS.md）
      - name: Patch flutter_tools (ohos native assets manifest)
        run: python3 tool/patch_flutter_tools_ohos.py "$GITHUB_WORKSPACE/flutter"
        working-directory: simple_live_app
        shell: bash

      - name: Build HAP (release, unsigned)
        run: flutter build hap --release --no-codesign
        working-directory: simple_live_app
        shell: bash

      # 防止 LFS 指针占位文件混入产物（会导致安装后白屏）
      - name: Verify HAP libraries
        run: |
          python3 tool/verify_ohos_hap.py ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap
        working-directory: simple_live_app
        shell: bash

      - name: Package output
        run: |
          cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
             simple_live_ohos_release_unsigned.hap
        working-directory: simple_live_app
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_ohos
          path: simple_live_app/simple_live_ohos_release_unsigned.hap
