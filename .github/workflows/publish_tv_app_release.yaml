name: app-build-action
#推送Tag时触发
on:
  push:
    tags:
      - "tv_*"

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  build-tv:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      #签出代码（构建触发源：tag 或分支，不再写死 master 分支）
      - uses: actions/checkout@v6

      #APK签名：fork 无签名 secrets 时生成临时 keystore（非官方签名）
      - name: Prepare Android signing
        working-directory: simple_live_tv_app/android
        run: |
          if [ -n "${{ secrets.TV_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.TV_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$PWD/keystore.jks" "${{ secrets.TV_STORE_PASSWORD }}" \
              "${{ secrets.TV_KEY_PASSWORD }}" "${{ secrets.TV_KEY_ALIAS }}" > key.properties
          else
            keytool -genkeypair -v -keystore keystore.jks -storepass simplelive \
              -keypass simplelive -alias simplelive -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Simple Live CI, OU=CI, O=Simple Live, C=CN"
            printf 'storeFile=%s\nstorePassword=simplelive\nkeyPassword=simplelive\nkeyAlias=simplelive\n' \
              "$PWD/keystore.jks" > key.properties
          fi
        shell: bash

      # 设置JAVA环境
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      # 设置Android SDK环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_tv_app/.fvmrc
          cache: true

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get

      - name: Validate Android toolchain
        run: |
          cd simple_live_tv_app
          flutter analyze --suggestions

      #打包APK
      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android_tv
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      #读取版本信息
      - name: Read version
        id: version
        uses: juliangruber/read-file-action@v1
        with:
          path: assets/tv_app_version.json
      - name: Echo version
        run: echo "${{ fromJson(steps.version.outputs.content).version }}"
      - name: Echo version content
        run: echo "${{ fromJson(steps.version.outputs.content).version_desc }}"

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ fromJson(steps.version.outputs.content).version }}"
          body: "# Android TV \n${{ fromJson(steps.version.outputs.content).version_desc }}"
          prerelease: ${{ fromJson(steps.version.outputs.content).prerelease }}
          token: ${{ secrets.TOKEN || github.token }}
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
