name: Release All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  JAVA_VERSION: "17"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # permission_handler 仓库 example 下有服务端缺失的 LFS 文件，跳过 example；
      # 其余 LFS 大文件必须正常下载
      - name: Configure git LFS excludes
        run: git config --global lfs.fetchexclude "example/**"

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Restore packages
        run: flutter pub get
        working-directory: simple_live_app

      # fork 环境无签名 secrets 时生成临时 keystore（非官方签名）
      - name: Prepare Android signing
        working-directory: simple_live_app/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$PWD/keystore.jks" "${{ secrets.STORE_PASSWORD }}" \
              "${{ secrets.KEY_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" > key.properties
          else
            keytool -genkeypair -v -keystore keystore.jks -storepass simplelive \
              -keypass simplelive -alias simplelive -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Simple Live CI, OU=CI, O=Simple Live, C=CN"
            printf 'storeFile=%s\nstorePassword=simplelive\nkeyPassword=simplelive\nkeyAlias=simplelive\n' \
              "$PWD/keystore.jks" > key.properties
          fi
        shell: bash

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: simple_live_app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/*-release.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git LFS excludes
        run: git config --global lfs.fetchexclude "example/**"
        shell: bash

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Restore packages
        run: flutter pub get
        working-directory: simple_live_app
        shell: bash

      - name: Build Windows
        run: flutter build windows --release
        working-directory: simple_live_app
        shell: bash

      - name: Package
        run: |
          cd simple_live_app/build/windows/x64/runner/Release
          7z a -tzip "$GITHUB_WORKSPACE/simple_live_windows_x64.zip" .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: simple_live_windows_x64.zip

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libmpv-dev
        shell: bash

      - name: Configure git LFS excludes
        run: git config --global lfs.fetchexclude "example/**"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Restore packages
        run: flutter pub get
        working-directory: simple_live_app

      - name: Build Linux
        run: flutter build linux --release
        working-directory: simple_live_app

      - name: Package
        run: |
          cd simple_live_app/build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/simple_live_linux_x64.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: simple_live_linux_x64.tar.gz

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git LFS excludes
        run: git config --global lfs.fetchexclude "example/**"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Restore packages
        run: flutter pub get
        working-directory: simple_live_app

      # 未签名/未公证，首次打开需右键-打开
      - name: Build macOS
        run: flutter build macos --release
        working-directory: simple_live_app

      - name: Package
        run: |
          cd simple_live_app/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Simple\ Live.app \
            "$GITHUB_WORKSPACE/simple_live_macos.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: simple_live_macos.zip

  ohos:
    name: HarmonyOS HAP (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils zip libglu1-mesa python3
        shell: bash

      - name: Configure git LFS excludes
        run: git config --global lfs.fetchexclude "example/**"
        shell: bash

      - name: Setup HarmonyOS toolchain
        uses: ErBWs/setup-ohos@v1
        with:
          version: latest
          cache: true

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup flutter-ohos
        run: |
          git clone -b oh-3.41.9-release https://gitcode.com/CPF-Flutter/flutter_flutter.git $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: simple_live_app
        shell: bash

      - name: Patch flutter_tools (ohos native assets manifest)
        run: python3 tool/patch_flutter_tools_ohos.py "$GITHUB_WORKSPACE/flutter"
        working-directory: simple_live_app
        shell: bash

      - name: Build HAP (release, unsigned)
        run: flutter build hap --release --no-codesign
        working-directory: simple_live_app
        shell: bash

      - name: Verify HAP libraries
        run: python3 tool/verify_ohos_hap.py ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap
        working-directory: simple_live_app
        shell: bash

      - name: Package output
        run: |
          cp ./ohos/entry/build/default/outputs/default/entry-default-unsigned.hap \
             simple_live_ohos_release_unsigned.hap
        working-directory: simple_live_app
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ohos
          path: simple_live_app/simple_live_ohos_release_unsigned.hap

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, linux, macos, ohos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
