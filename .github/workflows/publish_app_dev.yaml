name: app-build-action-dev

on:
  workflow_dispatch:
  push:
    tags:
      - "dev_v*"

env:
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.3"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  FLUTTER_OHOS_VERSION: oh-3.41.9-release

jobs:
  # 打包Android、iOS、Mac
  build-mac-ios-android:
    runs-on: macos-15-intel

    permissions:
      contents: write

    steps:
      # 签出代码（构建触发源：tag 或分支，不再写死 dev 分支）
      - uses: actions/checkout@v6

      # device_info_plus 12.4.0 使用 iOS 26.1 SDK 新增的 isiOSAppOnVision API。
      # macos-15-intel 默认使用 Xcode 16.4，因此显式选择 runner 已安装的新版本。
      - name: Select Xcode
        run: sudo xcode-select --switch "/Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer"

      # APK签名：fork 无签名 secrets 时生成临时 keystore（非官方签名）
      - name: Prepare Android signing
        working-directory: simple_live_app/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$PWD/keystore.jks" "${{ secrets.STORE_PASSWORD }}" \
              "${{ secrets.KEY_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" > key.properties
          else
            keytool -genkeypair -v -keystore keystore.jks -storepass simplelive \
              -keypass simplelive -alias simplelive -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Simple Live CI, OU=CI, O=Simple Live, C=CN"
            printf 'storeFile=%s\nstorePassword=simplelive\nkeyPassword=simplelive\nkeyAlias=simplelive\n' \
              "$PWD/keystore.jks" > key.properties
          fi
        shell: bash

      # 设置JAVA环境
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      # 设置Android SDK环境
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      # 设置 flutter-ohos SDK：鸿蒙适配插件的 Dart 代码使用 Platform.isOhos，
      # 该 API 仅存在于 CPF SDK，官方 Flutter 无法编译。必须完整克隆（浅克隆
      # 丢 git tag，SDK 版本会解析成 0.0.0-unknown 导致 pub get 失败）
      - name: Setup flutter-ohos
        run: |
          git clone -b $FLUTTER_OHOS_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      # 打开MAC Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-macos-desktop

      # flutter_tools 三补丁：pub get 不再强制鸿蒙 SDK 等（详见 README_OHOS.md）
      - name: Patch flutter_tools (ohos)
        run: |
          if ! python3 --version >/dev/null 2>&1; then py=python; else py=python3; fi
          "$py" tool/patch_flutter_tools_ohos.py "$RUNNER_TEMP/flutter"
        working-directory: simple_live_app
        shell: bash

      # 更新Flutter的packages（跳过 LFS smudge：permission_handler 的 example
      # 目录有服务端缺失的 LFS 文件；gitcode 网络偶发中断，重试三次）
      - name: Restore packages
        run: |
          cd simple_live_app
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && exit 0
            echo "pub get failed, retry ($i/3)..."; sleep 20
          done
          echo "ERROR: flutter pub get failed after 3 attempts" >&2
          exit 1

      - name: Validate Android toolchain
        run: |
          cd simple_live_app
          flutter analyze --suggestions

      # 安装appdmg npm install -g appdmg
      - name: Install appdmg
        run: npm install -g appdmg

      # 设置flutter_distributor环境（pub 全局命令需把 bin 目录加入 PATH）
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # 打包APK
      - name: Build APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      #上传Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      #打包iOS
      - name: Build IPA
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      #创建未签名ipa
      - name: Create IPA
        run: |
          cd simple_live_app
          mkdir build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload
          cd ../../..

      # 上传IPA至Artifacts
      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ios
          path: |
            simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      # 打包MAC
      - name: Build MacOS
        run: |
          cd simple_live_app
          flutter_distributor package --platform macos --targets dmg,zip --skip-clean

      # 上传MAC至Artifacts
      - name: Upload MacOS to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            simple_live_app/build/dist/*/*.dmg
            simple_live_app/build/dist/*/*.zip
      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # 打包Linux
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # 签出代码（构建触发源：tag 或分支，不再写死 dev 分支）
      - uses: actions/checkout@v6
      # 设置 flutter-ohos SDK（鸿蒙插件依赖 Platform.isOhos，官方 SDK 编译不过）
      - name: Setup flutter-ohos
        run: |
          git clone -b $FLUTTER_OHOS_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
        shell: bash
      # 安装依赖
      - name: Update apt-get
        run: sudo apt-get update
      - name: Install Dependencies
        run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      # 打开Linux Desktop支持
      - name: Enable Flutter Desktop
        run: flutter config --enable-linux-desktop
      # flutter_tools 三补丁：pub get 不再强制鸿蒙 SDK 等（详见 README_OHOS.md）
      - name: Patch flutter_tools (ohos)
        run: |
          if ! python3 --version >/dev/null 2>&1; then py=python; else py=python3; fi
          "$py" tool/patch_flutter_tools_ohos.py "$RUNNER_TEMP/flutter"
        working-directory: simple_live_app
        shell: bash

      # 更新Flutter的packages（跳过 LFS smudge + 网络重试）
      - name: Restore Packages
        run: |
          cd simple_live_app
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && exit 0
            echo "pub get failed, retry ($i/3)..."; sleep 20
          done
          echo "ERROR: flutter pub get failed after 3 attempts" >&2
          exit 1
      # 设置flutter_distributor环境（pub 全局命令需把 bin 目录加入 PATH）
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
      # build Linux ZIP\DMG
      - name: Build Linux
        run: |
          cd simple_live_app
          flutter_distributor package --platform linux --targets deb,zip --skip-clean
      # 上传Linux包至Artifacts
      - name: Upload Linux APP to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            simple_live_app/build/dist/*/*.deb
            simple_live_app/build/dist/*/*.zip

        #完成
      - run: echo "🍏 Linux job's status is ${{ job.status }}."

  # 打包Windows
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      # 签出代码（构建触发源：tag 或分支，不再写死 dev 分支）
      - uses: actions/checkout@v6
      # 设置 flutter-ohos SDK（鸿蒙插件依赖 Platform.isOhos，官方 SDK 编译不过；
      # longpaths：git 依赖仓库内路径超长会导致检出失败）
      - name: Setup flutter-ohos
        run: |
          git config --global core.longpaths true
          git clone -b $env:FLUTTER_OHOS_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\flutter\bin"
        shell: pwsh
      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop
      # flutter_tools 三补丁：pub get 不再强制鸿蒙 SDK 等（详见 README_OHOS.md）
      - name: Patch flutter_tools (ohos)
        run: |
          if ! python3 --version >/dev/null 2>&1; then py=python; else py=python3; fi
          "$py" tool/patch_flutter_tools_ohos.py "$RUNNER_TEMP/flutter"
        working-directory: simple_live_app
        shell: bash
      - name: Restore Packages
        run: |
          cd simple_live_app
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && exit 0
            echo "pub get failed, retry ($i/3)..."; sleep 20
          done
          echo "ERROR: flutter pub get failed after 3 attempts" >&2
          exit 1
        shell: bash
      # 设置flutter_distributor环境（pub 全局命令需把 bin 目录加入 PATH）
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\Pub\Cache\bin"
        shell: pwsh
      # build Windows ZIP\MSIX
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean
      # 上传Windows至Artifacts
      - name: Upload Windows APP to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
        #完成
      - run: echo "🍏 Windows job's status is ${{ job.status }}."
