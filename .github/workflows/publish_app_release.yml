name: app-build-action
#推送Tag时触发
on:
  push:
    tags:
      - "v*"

# 客户端范围：Android + Windows（鸿蒙 HAP 见 build_ohos.yml，TV 见 publish_tv_*）
# 全部使用 flutter-ohos SDK：鸿蒙适配插件的 Dart 代码使用 Platform.isOhos，
# 该 API 仅存在于 CPF SDK，官方 Flutter 无法编译。必须完整克隆 SDK（浅克隆
# 丢 git tag，SDK 版本会解析成 0.0.0-unknown 导致 pub get 失败）。
env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"
  FLUTTER_OHOS_VERSION: oh-3.41.9-release

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Setup flutter-ohos
        run: |
          git clone -b $FLUTTER_OHOS_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH
        shell: bash

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      # flutter_tools 三补丁：pub get 不再强制鸿蒙 SDK 等（详见 README_OHOS.md）
      - name: Patch flutter_tools (ohos)
        run: |
          if ! python3 --version >/dev/null 2>&1; then py=python; else py=python3; fi
          "$py" tool/patch_flutter_tools_ohos.py "$RUNNER_TEMP/flutter"
        working-directory: simple_live_app
        shell: bash

      - name: Restore packages
        run: |
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && exit 0
            echo "pub get failed, retry ($i/3)..."; sleep 20
          done
          echo "ERROR: flutter pub get failed after 3 attempts" >&2
          exit 1
        working-directory: simple_live_app
        shell: bash

      # fork 环境无签名 secrets 时生成临时 keystore（非官方签名）
      - name: Prepare Android signing
        working-directory: simple_live_app/android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$PWD/keystore.jks" "${{ secrets.STORE_PASSWORD }}" \
              "${{ secrets.KEY_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" > key.properties
          else
            keytool -genkeypair -v -keystore keystore.jks -storepass simplelive \
              -keypass simplelive -alias simplelive -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Simple Live CI, OU=CI, O=Simple Live, C=CN"
            printf 'storeFile=%s\nstorePassword=simplelive\nkeyPassword=simplelive\nkeyAlias=simplelive\n' \
              "$PWD/keystore.jks" > key.properties
          fi
        shell: bash

      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: simple_live_app
        shell: bash

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      #上传至Release（assets/app_version.json 已随上游"移除检查更新"提交删除，
      #改用 tag 名命名 + 自动生成 release notes；TOKEN 未配置时回退默认令牌）
      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.TOKEN || github.token }}
          files: |
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # longpaths：git 依赖仓库内路径超长会导致检出失败
      - name: Setup flutter-ohos
        run: |
          git config --global core.longpaths true
          git clone -b $env:FLUTTER_OHOS_VERSION https://gitcode.com/CPF-Flutter/flutter_flutter.git "$env:RUNNER_TEMP\flutter"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\flutter\bin"
        shell: pwsh

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      # flutter_tools 三补丁：pub get 不再强制鸿蒙 SDK 等（详见 README_OHOS.md）
      - name: Patch flutter_tools (ohos)
        run: |
          if ! python3 --version >/dev/null 2>&1; then py=python; else py=python3; fi
          "$py" tool/patch_flutter_tools_ohos.py "$RUNNER_TEMP/flutter"
        working-directory: simple_live_app
        shell: bash

      - name: Restore packages
        run: |
          for i in 1 2 3; do
            GIT_LFS_SKIP_SMUDGE=1 flutter pub get && exit 0
            echo "pub get failed, retry ($i/3)..."; sleep 20
          done
          echo "ERROR: flutter pub get failed after 3 attempts" >&2
          exit 1
        working-directory: simple_live_app
        shell: bash

      # flutter_distributor（pub 全局命令需把 bin 目录加入 PATH）
      - name: Install flutter_distributor
        run: |
          dart pub global activate flutter_distributor
          Add-Content $env:GITHUB_PATH "$env:LOCALAPPDATA\Pub\Cache\bin"
        shell: pwsh

      - name: Build Windows
        run: |
          cd simple_live_app
          flutter_distributor package --platform windows --targets msix,zip --skip-clean
        shell: bash

      - name: Upload Windows to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip

      #上传至Release（tag 名 + 自动生成 notes + token 回退）
      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          token: ${{ secrets.TOKEN || github.token }}
          files: |
            simple_live_app/build/dist/*/*.msix
            simple_live_app/build/dist/*/*.zip
